# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: 'Evaluation of the retrieval system'
# Optionally set API keys here instead of exporting environment variables.
# Never commit real keys to source control.
# env:
#   OPENAI_API_KEY: sk-...
# setting up initial prompt, which is the query provided as the var below.
prompts:
  - '{{query}}'

# We add a custom provider which retrieves relevant chunks from the documentation based on the query and returns them as context to the prompt. This allows us to test if the retrieval system is correctly fetching the relevant information for a given query.
providers:
  - file://retrieval-provider.ts
  # Or setup models from other providers
  # - anthropic:messages:claude-sonnet-4-6
  # - google:gemini-3.1-pro-preview

# Test definitions
tests:
  - vars:
      query: What's the example used in the MDN docs to demonstrate how to declare a variable?
    # deterministic part checking if the chunks pop up when the user asks the query.
    assert:
      - type: contains-all
        value:
          - grammar_and_types/index.md_chunk_7
          - language_overview/index.md_chunk_14
